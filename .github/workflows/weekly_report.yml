name: 每周爆文复盘报告

on:
  schedule:
    # 每周一北京时间 09:30 → UTC 01:30
    - cron: '30 1 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -c "from weekly_report import send_weekly_report; import os; send_weekly_report(os.environ['FEISHU_APP_ID'], os.environ['FEISHU_APP_SECRET'], os.environ['FEISHU_BITABLE_APP_TOKEN'], os.environ['FEISHU_WEBHOOK_URL'], os.environ.get('FEISHU_WEBHOOK_SECRET',''))"
